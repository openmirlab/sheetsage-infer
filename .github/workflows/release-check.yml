name: Release verification

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Install package + test dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run test gate
        run: pytest tests/ -v

      - name: Clean previous builds
        run: |
          rm -rf dist/ build/ *.egg-info/ sheetsage.egg-info/

      - name: Build package
        run: python -m build
      
      - name: Check package
        run: |
          pip install twine
          twine check dist/*
