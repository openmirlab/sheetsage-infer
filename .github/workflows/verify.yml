name: Verify delivery

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CPU Torch and fresh project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch>=2.7' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install '.[dev]' build
          python -m pip check
          python -c 'import torch; assert torch.version.cuda is None, torch.__version__; print(torch.__version__)'
      - name: Lint delivery tools
        run: ruff check tools/capture_cpu_baseline.py tools/check_distribution_boundary.py tools/verify_installed.py sheetsage/__about__.py
      - name: Run complete current contract suite
        run: python -m pytest tests/ tools/test_dataset_examples.py -ra --junitxml=pytest-results.xml
      - name: Build wheel from source archive and verify package boundary
        run: |
          python -m build
          python tools/check_distribution_boundary.py dist/*.whl dist/*.tar.gz
      - name: Verify installed wheel outside checkout
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -m pip check
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/tools/verify_installed.py" "$GITHUB_WORKSPACE"
      - name: Capture failure diagnostics
        if: failure()
        run: |
          python -m pip freeze > dependency-versions.txt
          python -m torch.utils.collect_env > torch-environment.txt 2>&1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: delivery-python-${{ matrix.python-version }}
          path: |
            pytest-results.xml
            dependency-versions.txt
            torch-environment.txt
