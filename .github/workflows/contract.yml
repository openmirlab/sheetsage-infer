name: Verify inference boundary

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch>=2.7' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install '.[dev]' build
          python -m pip check
      - name: Test inference and dataset boundary
        run: python -m pytest tests/ tools/test_dataset_examples.py -ra
      - name: Check wheel and source archive contents
        run: |
          python -m build
          python tools/check_distribution_boundary.py dist/*.whl dist/*.tar.gz
